[package]
name = "palace-program-guest"
version = "0.1.0"
edition = "2021"
authors = ["Ricardo Guilherme Schmidt"]
license = "MIT"
repository = "https://github.com/3esmit/logos-palace"

[workspace]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[[bin]]
name = "palace"
path = "src/bin/palace.rs"

[dependencies]
borsh = "1.5"
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
palace_program = { path = "../.." }
risc0-zkvm = { version = "=3.0.5", default-features = false }
ruint = { version = "=1.17.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", package = "spel-framework" }
