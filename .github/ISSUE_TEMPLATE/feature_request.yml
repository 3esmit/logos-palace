name: Feature request
description: Propose a scoped Logos Palace capability
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior
      description: Define success and failure from a user or protocol perspective.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Palace UI
        - Palace Core
        - Palace VM
        - Palace LEZ program
        - Delivery
        - Storage
        - Basecamp
        - Documentation
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Security, compatibility, and deferral tradeoffs
